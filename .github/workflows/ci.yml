name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality tools
        run: python -m pip install -e ".[ci]"

      - name: Run Ruff
        run: python -m ruff check src tests deploy

      - name: Build distributions
        run: python -m build

      - name: Install and import wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import agent_orchestrator; assert agent_orchestrator.__version__ == '0.8.0'"

      - name: Build container image
        run: docker build --tag ai-agent-orchestrator:ci .

  gate:
    name: CI
    if: ${{ always() }}
    needs:
      - tests
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every CI job
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          test "$TESTS_RESULT" = "success"
          test "$QUALITY_RESULT" = "success"
