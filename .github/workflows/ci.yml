name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality tools
        run: python -m pip install -e ".[ci]"

      - name: Run Ruff
        run: python -m ruff check src tests deploy

      - name: Build distributions
        run: python -m build

      - name: Install and import wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import agent_orchestrator; assert agent_orchestrator.__version__ == '0.12.4'"

      - name: Build container image
        run: docker build --tag ai-agent-orchestrator:ci .

  desktop:
    name: Desktop UI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Test desktop journeys
        working-directory: desktop
        run: pnpm test

      - name: Build desktop frontend
        working-directory: desktop
        run: pnpm build

  desktop-native:
    name: Desktop native shell
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Set up Python for the packaged sidecar
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned sidecar build dependencies
        run: python -m pip install ".[desktop-build]"

      - name: Build and self-check the Windows sidecar
        shell: powershell
        run: ./packaging/build-windows-sidecar.ps1 -Python python

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check

      - name: Test native command boundary
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

      - name: Build NSIS installer
        working-directory: desktop
        run: pnpm tauri build --bundles nsis

      - name: Collect and checksum installer
        shell: powershell
        run: ./packaging/collect-windows-installer.ps1

      - name: Smoke-test install and uninstall behavior
        shell: powershell
        run: ./packaging/test-windows-installer.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-agent-orchestrator-windows-installer
          path: |
            dist/windows-installer/**
          if-no-files-found: error
          retention-days: 14

  desktop-baseline:
    name: Windows 0.10.0 baseline installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out the approved 0.10.0 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e27665475cd8d8c3612ab0b453a5ae1992ef2bf2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Set up Python for the baseline sidecar
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned baseline build dependencies
        run: python -m pip install ".[desktop-build]"

      - name: Build and self-check the baseline sidecar
        shell: powershell
        run: ./packaging/build-windows-sidecar.ps1 -Python python

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install baseline desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Build baseline NSIS installer
        working-directory: desktop
        run: pnpm tauri build --bundles nsis

      - name: Collect and checksum baseline installer
        shell: powershell
        run: ./packaging/collect-windows-installer.ps1

      - name: Upload immutable baseline installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-agent-orchestrator-windows-0.10.0-baseline
          path: |
            dist/windows-installer/*.exe
            dist/windows-installer/*.sha256
            dist/windows-installer/*.build.json
          if-no-files-found: error
          retention-days: 14

  candidate-validation:
    name: Candidate install and Defender (${{ matrix.os }})
    needs:
      - desktop-native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025

    steps:
      - name: Check out validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download candidate installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-agent-orchestrator-windows-installer
          path: work/candidate-installer

      - name: Validate first launch, install, and uninstall
        shell: powershell
        run: |
          $installer = Get-ChildItem work/candidate-installer -Filter *.exe -File
          ./packaging/test-windows-installer.ps1 `
            -InstallerPath $installer.FullName `
            -LaunchApplication

      - name: Scan candidate with Microsoft Defender
        shell: powershell
        run: |
          $installer = Get-ChildItem work/candidate-installer -Filter *.exe -File
          ./packaging/scan-windows-installer.ps1 `
            -InstallerPath $installer.FullName `
            -EvidenceDirectory "work/security-scan/${{ matrix.os }}"

      - name: Upload Defender evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-agent-orchestrator-defender-${{ matrix.os }}
          path: work/security-scan/${{ matrix.os }}/*.json
          if-no-files-found: error
          retention-days: 14

  desktop-upgrade:
    name: Windows 0.10.0 to 0.12.4 upgrade
    needs:
      - desktop-native
      - desktop-baseline
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download baseline installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-agent-orchestrator-windows-0.10.0-baseline
          path: work/baseline-installer

      - name: Download candidate installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-agent-orchestrator-windows-installer
          path: work/candidate-installer

      - name: Validate real installer and Schema upgrade
        shell: powershell
        run: |
          $baseline = Get-ChildItem work/baseline-installer -Filter *.exe -File
          $candidate = Get-ChildItem work/candidate-installer -Filter *.exe -File
          ./packaging/test-windows-upgrade.ps1 `
            -BaselineInstaller $baseline.FullName `
            -CandidateInstaller $candidate.FullName

      - name: Upload upgrade evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-agent-orchestrator-upgrade-evidence
          path: |
            work/upgrade-evidence/*.json
            work/upgrade-evidence/*.log
          if-no-files-found: error
          retention-days: 14

  gate:
    name: CI
    if: ${{ always() }}
    needs:
      - tests
      - quality
      - desktop
      - desktop-native
      - desktop-baseline
      - candidate-validation
      - desktop-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every CI job
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          DESKTOP_NATIVE_RESULT: ${{ needs.desktop-native.result }}
          DESKTOP_BASELINE_RESULT: ${{ needs.desktop-baseline.result }}
          CANDIDATE_VALIDATION_RESULT: ${{ needs.candidate-validation.result }}
          DESKTOP_UPGRADE_RESULT: ${{ needs.desktop-upgrade.result }}
        run: |
          test "$TESTS_RESULT" = "success"
          test "$QUALITY_RESULT" = "success"
          test "$DESKTOP_RESULT" = "success"
          test "$DESKTOP_NATIVE_RESULT" = "success"
          test "$DESKTOP_BASELINE_RESULT" = "success"
          test "$CANDIDATE_VALIDATION_RESULT" = "success"
          test "$DESKTOP_UPGRADE_RESULT" = "success"
