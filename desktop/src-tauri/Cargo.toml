[package]
name = "aiao-desktop"
version = "0.9.0"
description = "Local desktop control plane for AI Agent Orchestrator"
authors = ["AI Agent Orchestrator contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aiao_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
