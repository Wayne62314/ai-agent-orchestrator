[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-orchestrator"
version = "0.12.2"
description = "A resumable, event-driven orchestrator for long-running AI development tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "AI Agent Orchestrator contributors" }]
dependencies = []

[project.optional-dependencies]
codex = ["openai-codex==0.144.4"]
ci = ["build==1.5.0", "ruff==0.16.0"]
desktop-build = [
    "openai-codex==0.144.4",
    "pyinstaller==6.21.0",
]

[project.scripts]
agent-orchestrator = "agent_orchestrator.cli:main"
agent-orchestrator-desktop-rpc = "agent_orchestrator.desktop_rpc:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
