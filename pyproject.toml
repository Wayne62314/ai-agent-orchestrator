[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-orchestrator"
version = "0.4.0"
description = "A resumable, event-driven orchestrator for long-running AI development tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "AI Agent Orchestrator contributors" }]
dependencies = []

[project.optional-dependencies]
codex = ["openai-codex==0.144.4"]

[project.scripts]
agent-orchestrator = "agent_orchestrator.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
